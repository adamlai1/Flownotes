<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Matches the header (bg-gray-900), not the page background, so the status-bar
         region blends into the nav. Kept in step by ThemeContext.applyTheme. -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="Nubble" />
    <meta name="description" content="Nubble" />
    <title>Nubble</title>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML = '<div style="color:red;padding:20px;font-size:16px;font-family:monospace;white-space:pre-wrap;">' + msg + '<br>Line: ' + line + '<br>File: ' + url + (error && error.stack ? '<br><br>' + error.stack : '') + '</div>';
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
